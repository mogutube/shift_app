<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シフト自動生成</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:1200px; margin:0 auto; padding:32px 20px 56px; }
    h1 { margin:0 0 8px; font-size:30px; }
    h2 { margin:0 0 16px; font-size:20px; }
    p { line-height:1.7; }
    .note { background:#fff7ed; border:1px solid #fed7aa; padding:12px 14px; border-radius:10px; margin:16px 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; box-shadow:0 2px 10px rgba(0,0,0,.03); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .member { display:grid; grid-template-columns:1fr 1.5fr; gap:10px; align-items:end; padding:12px; background:#f9fafb; border-radius:10px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
    input { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px; }
    .cal-head { text-align:center; font-size:12px; color:var(--muted); font-weight:700; padding:6px; }
    .day { border:1px solid var(--line); background:white; min-height:68px; border-radius:8px; padding:7px; cursor:pointer; user-select:none; }
    .day:hover { border-color:#93c5fd; }
    .day.selected { background:#fee2e2; border-color:#fca5a5; }
    .day.empty { visibility:hidden; cursor:default; }
    .day-num { font-weight:700; }
    .day-sub { font-size:11px; color:var(--muted); margin-top:8px; }
    .controls { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
    button { border:0; background:var(--accent); color:white; padding:11px 18px; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .error { display:none; white-space:pre-line; background:#fef2f2; color:var(--danger); border:1px solid #fecaca; padding:13px; border-radius:10px; margin-bottom:18px; }
    .result { display:none; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th,td { border-bottom:1px solid var(--line); padding:9px 10px; text-align:center; }
    th { background:#f9fafb; position:sticky; top:0; }
    td.name { text-align:left; font-weight:600; }
    .closed { color:var(--muted); background:#f3f4f6; }
    .sat { color:#2563eb; }
    .sun { color:#dc2626; }
    .legend { color:var(--muted); font-size:13px; margin-top:10px; }
    .small { font-size:12px; color:var(--muted); }
    @media(max-width:800px){ .grid{grid-template-columns:1fr;} .member{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="wrap">
  <h1>シフト自動生成</h1>
  <p class="small">6人・1日2人（A/B）・公平性と勤務間隔を含む制約付きシフト生成</p>

  <div class="note"><strong>ペア条件:</strong> 「A担当者 → B担当者」を1つの勤務ペアとして扱います。たとえば X=◎・Y=◯ と X=◯・Y=◎ は別ペアです。同じ順序付きペアは月内で再利用しません。6人では30通りあるため、営業日は最大30日です。</div>

  <div class="card">
    <h2>1. 対象年月</h2>
    <div class="controls">
      <div><label>年</label><input id="year" type="number" min="2020" max="2100"></div>
      <div><label>月</label><input id="month" type="number" min="1" max="12"></div>
      <button type="button" onclick="buildCalendars()">カレンダー更新</button>
    </div>
  </div>

  <div class="card">
    <h2>2. メンバー6人と休み希望（各5日まで）</h2>
    <div class="grid" id="members"></div>
  </div>

  <div class="card">
    <h2>3. 店休日</h2>
    <p class="small">日付をクリックすると店休日になります。曜日は対象年月から自動計算されます。</p>
    <div id="closedCalendar" class="calendar"></div>
  </div>

  <div class="card">
    <button id="generateBtn" onclick="generateShift()">条件をすべて満たすシフトを生成</button>
  </div>

  <div id="error" class="error"></div>

  <div id="result" class="result">
    <div class="card">
      <h2 id="resultTitle">生成結果</h2>
      <div class="table-wrap"><table id="shiftTable"></table></div>
      <div class="legend">◎ = ポジションA / ◯ = ポジションB / 休 = 非勤務 / 店休 = 店休日</div>
    </div>
    <div class="card">
      <h2>公平性チェック</h2>
      <div class="table-wrap"><table id="statsTable"></table></div>
    </div>
  </div>
</div>

<script>
const weekdayJP = ['日','月','火','水','木','金','土'];
let closedDays = new Set();
let offRequests = Array.from({length:6}, () => new Set());

function init(){
  const now = new Date();
  document.getElementById('year').value = now.getFullYear();
  document.getElementById('month').value = now.getMonth()+1;
  const members = document.getElementById('members');
  for(let i=0;i<6;i++){
    const box=document.createElement('div'); box.className='member';
    box.innerHTML=`<div><label>メンバー${i+1}</label><input id="name${i}" placeholder="名前を入力"></div>
      <div><label>休み希望（最大5日・カンマ区切り）</label><input id="off${i}" placeholder="例: 3, 8, 17"></div>`;
    members.appendChild(box);
  }
  buildCalendars();
}

function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function buildCalendars(){
  const y=+document.getElementById('year').value, m=+document.getElementById('month').value;
  if(!y || !m) return;
  closedDays = new Set([...closedDays].filter(d=>d<=daysInMonth(y,m)));
  const cal=document.getElementById('closedCalendar'); cal.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(w=>{const e=document.createElement('div');e.className='cal-head';e.textContent=w;cal.appendChild(e)});
  const first=new Date(y,m-1,1).getDay();
  for(let i=0;i<first;i++){ const e=document.createElement('div');e.className='day empty';cal.appendChild(e); }
  for(let d=1;d<=daysInMonth(y,m);d++){
    const wd=new Date(y,m-1,d).getDay();
    const e=document.createElement('div'); e.className='day'+(closedDays.has(d)?' selected':'');
    e.innerHTML=`<div class="day-num ${wd===0?'sun':wd===6?'sat':''}">${d}日 (${weekdayJP[wd]})</div><div class="day-sub">${closedDays.has(d)?'店休':'営業'}</div>`;
    e.onclick=()=>{ closedDays.has(d)?closedDays.delete(d):closedDays.add(d); buildCalendars(); };
    cal.appendChild(e);
  }
}

function parseOff(text, maxDay){
  if(!text.trim()) return [];
  const vals=[...new Set(text.split(/[、,\s]+/).filter(Boolean).map(Number))];
  if(vals.some(v=>!Number.isInteger(v)||v<1||v>maxDay)) throw new Error('休み希望の日付に不正な値があります。');
  if(vals.length>5) throw new Error('休み希望は1人5日までです。');
  return vals.sort((a,b)=>a-b);
}

async function generateShift(){
  const error=document.getElementById('error'); error.style.display='none';
  const result=document.getElementById('result'); result.style.display='none';
  const btn=document.getElementById('generateBtn'); btn.disabled=true; btn.textContent='生成中…';
  try{
    const year=+document.getElementById('year').value, month=+document.getElementById('month').value;
    const maxDay=daysInMonth(year,month);
    const names=Array.from({length:6},(_,i)=>document.getElementById('name'+i).value.trim());
    if(names.some(n=>!n)) throw new Error('6人全員の名前を入力してください。');
    const requests=Array.from({length:6},(_,i)=>parseOff(document.getElementById('off'+i).value,maxDay));
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year,month,names,closed_days:[...closedDays],requests})});
    const data=await res.json();
    if(!data.ok) throw new Error(data.error || '生成に失敗しました。');
    renderResult(data.result,names);
  }catch(e){ error.textContent=e.message; error.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='条件をすべて満たすシフトを生成'; }
}

function renderResult(r,names){
  document.getElementById('resultTitle').textContent=`${r.year}年${r.month}月 シフト（営業日 ${r.open_days}日）`;
  let html='<thead><tr><th>日付</th><th>曜</th>'+names.map(n=>`<th>${escapeHtml(n)}</th>`).join('')+'</tr></thead><tbody>';
  for(const row of r.rows){
    const cls=row.weekday==='土'?'sat':row.weekday==='日'?'sun':'';
    html+=`<tr class="${row.closed?'closed':''}"><td>${row.day}</td><td class="${cls}">${row.weekday}</td>`;
    for(const n of names){
      if(row.closed){ html+='<td>店休</td>'; continue; }
      const a=row.assignments.find(x=>x.name===n);
      html+=`<td>${a ? a.mark : '休'}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody>'; document.getElementById('shiftTable').innerHTML=html;

  let sh='<thead><tr><th>メンバー</th><th>勤務</th><th>A(◎)</th><th>B(◯)</th><th>土日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th></tr></thead><tbody>';
  for(const s of r.member_stats){
    sh+=`<tr><td class="name">${escapeHtml(s.name)}</td><td>${s.total}</td><td>${s.A}</td><td>${s.B}</td><td>${s.weekend}</td>${['月','火','水','木','金','土','日'].map(w=>`<td>${s.weekday_counts[w]}</td>`).join('')}</tr>`;
  }
  sh+='</tbody>'; document.getElementById('statsTable').innerHTML=sh;
  document.getElementById('result').style.display='block';
}
function escapeHtml(s){ return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
init();
</script>
</body>
</html>
