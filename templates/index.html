<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シフト自動生成</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #222; }
    main { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1,h2 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:8px; }
    button { padding:12px 18px; border:0; border-radius:10px; cursor:pointer; font-weight:700; }
    .primary { background:#111827; color:white; }
    .error { background:#fee2e2; color:#991b1b; padding:14px; border-radius:10px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px; border-bottom:1px solid #e5e7eb; text-align:center; }
    th { background:#f9fafb; }
    .holiday { font-weight:700; }
    .closed { color:#999; }
    .small { font-size:.9rem; color:#666; }
    .scroll { overflow-x:auto; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>シフト自動生成</h1>
    <p class="small">A=◎、B=◯。全条件を満たす組み合わせがない場合はシフトを生成しません。</p>

    <div class="grid">
      <div>
        <label>年</label>
        <input id="year" type="number" min="2020" max="2100">
      </div>
      <div>
        <label>月</label>
        <input id="month" type="number" min="1" max="12">
      </div>
      <div>
        <label>店休日（日付をカンマ区切り）</label>
        <input id="closed" placeholder="例: 3,10,17">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>メンバー</h2>
    <div id="members" class="grid"></div>
  </div>

  <div class="card">
    <button class="primary" onclick="generateShift()">シフト生成</button>
  </div>

  <div id="message"></div>
  <div id="result"></div>
</main>

<script>
const now = new Date();
document.getElementById('year').value = now.getFullYear();
document.getElementById('month').value = now.getMonth() + 1;

const members = document.getElementById('members');
for (let i=0;i<6;i++) {
  members.insertAdjacentHTML('beforeend', `
    <div>
      <label>メンバー ${i+1}</label>
      <input id="name${i}" placeholder="名前">
      <label style="margin-top:8px">休み希望（最大5日、カンマ区切り）</label>
      <input id="req${i}" placeholder="例: 2,9,21">
    </div>
  `);
}

function parseDays(s) {
  if (!s.trim()) return [];
  return [...new Set(s.split(',').map(x => parseInt(x.trim(),10)).filter(Number.isFinite))];
}

async function generateShift() {
  const year = parseInt(document.getElementById('year').value,10);
  const month = parseInt(document.getElementById('month').value,10);
  const names = [...Array(6)].map((_,i)=>document.getElementById(`name${i}`).value.trim());
  const requests = [...Array(6)].map((_,i)=>parseDays(document.getElementById(`req${i}`).value));
  const closed_days = parseDays(document.getElementById('closed').value);

  document.getElementById('message').innerHTML = '';
  document.getElementById('result').innerHTML = '';

  const res = await fetch('/api/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({year,month,names,requests,closed_days})
  });

  const data = await res.json();

  if (!data.ok) {
    document.getElementById('message').innerHTML = `<div class="card error">${data.error}</div>`;
    return;
  }

  const r = data.result;

  let scheduleRows = r.rows.map(row => {
    let ass = row.closed
      ? '<span class="closed">店休日</span>'
      : row.assignments.map(a=>`${a.mark} ${a.name}`).join(' / ');

    let dayLabel = `${row.day}日（${row.weekday}）`;
    if (row.holiday) {
      dayLabel += ` <span class="holiday">祝 ${row.holiday_name}</span>`;
    }

    return `<tr><td>${dayLabel}</td><td>${ass}</td></tr>`;
  }).join('');

  let statRows = r.member_stats.map(m => `
    <tr>
      <td>${m.name}</td>
      <td>${m.total}</td>
      <td>${m.A}</td>
      <td>${m.B}</td>
      <td>${m.weekend_holiday}</td>
      <td>${m.weekday_counts["月"]}</td>
      <td>${m.weekday_counts["火"]}</td>
      <td>${m.weekday_counts["水"]}</td>
      <td>${m.weekday_counts["木"]}</td>
      <td>${m.weekday_counts["金"]}</td>
      <td>${m.weekday_counts["土"]}</td>
      <td>${m.weekday_counts["日"]}</td>
    </tr>
  `).join('');

  document.getElementById('result').innerHTML = `
    <div class="card">
      <h2>${r.year}年${r.month}月 シフト</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>日付</th><th>勤務</th></tr></thead>
          <tbody>${scheduleRows}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>勤務集計</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>名前</th>
              <th>総勤務</th>
              <th>A(◎)</th>
              <th>B(◯)</th>
              <th>土日祝</th>
              <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th>
            </tr>
          </thead>
          <tbody>${statRows}</tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
